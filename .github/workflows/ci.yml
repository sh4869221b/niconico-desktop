name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate routes and local storage
        run: dotnet run --project tests/NiconicoDesktop.Tests.csproj -c Release
      - name: Publish Windows x64
        run: dotnet publish NiconicoDesktop.csproj -c Release -r win-x64 --self-contained true -o .publish/win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: NiconicoDesktop-win-x64
          path: .publish/win-x64/
          if-no-files-found: error
