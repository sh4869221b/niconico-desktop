name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH). Leave blank for build only.'
        type: string
        required: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate routes and local storage
        run: dotnet run --project tests/NiconicoDesktop.Tests.csproj -c Release
      - name: Publish Windows x64
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          $build = @()
          if ($tag) {
            if ($tag -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Expected vMAJOR.MINOR.PATCH.' }
            $build += "-p:Version=$($tag.Substring(1))"
          }
          dotnet publish NiconicoDesktop.csproj -c Release -r win-x64 --self-contained true -o .publish/win-x64 @build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path .publish/win-x64/* -DestinationPath NiconicoDesktop-win-x64.zip
          $digest = (Get-FileHash NiconicoDesktop-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  NiconicoDesktop-win-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: NiconicoDesktop-win-x64
          path: |
            NiconicoDesktop-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != '')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: NiconicoDesktop-win-x64
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          args=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            args=(--verify-tag)
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check -
          gh release create "$tag" NiconicoDesktop-win-x64.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes "${args[@]}"
